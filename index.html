<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171A2F">
<title>Genesis Quest: Play the Bible. Learn the Bible. Know the Bible.</title>
<meta name="description" content="A Bible-learning game on Genesis 1–3. Every answer explains something, and every explanation points back to Scripture.">
<link rel="manifest" href="manifest.json"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Genesis Quest"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--night:#171A2F;--firm:#24305A;--gold:#E3B341;--leaf:#3F8A5F;--fruit:#B4363F;--page:#FBFAF6;--ink:#1E2233;--mute:#5F6679;--line:#E3E0D7;--soft:#F1EFE8;
--serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--night);color:#fff;font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px}
h1,h2,h3{font-family:var(--serif);font-weight:700;margin:0}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px 16px;font-weight:700;font-size:16.5px;text-align:center}
.btn:disabled{opacity:.45;cursor:default}
.b-gold{background:var(--gold);color:#241B05}.b-ink{background:var(--ink);color:#fff}.b-line{background:transparent;border:2px solid #47507A;color:#fff}
.b-page{background:#fff;color:var(--ink);border:2px solid var(--line)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
/* home */
.hero{padding:22px 4px 10px}
.hero h1{font-size:44px;line-height:1;letter-spacing:-.5px}
.hero .tag{font-family:var(--serif);font-style:italic;color:#D9D3BF;font-size:18px;margin:10px 0 0}
.stats{display:flex;gap:10px;margin:18px 0 16px}
.stat{flex:1;background:#20253F;border-radius:14px;padding:11px 12px}
.stat b{display:block;font-family:var(--serif);font-size:26px;line-height:1.1;color:var(--gold)}
.stat span{font-size:13px;color:#B7BCD1}
.chap{position:relative;display:grid;grid-template-columns:62px 1fr;gap:12px;align-items:center;width:100%;text-align:left;background:var(--page);color:var(--ink);border:0;border-radius:16px;padding:14px 14px 14px 12px;margin:0 0 10px;overflow:hidden}
.chap .num{font-family:var(--serif);font-size:54px;line-height:.9;font-weight:700;color:var(--c);text-align:center}
.chap h2{font-size:20px}.chap p{margin:2px 0 6px;font-size:14px;color:var(--mute)}
.bar{height:7px;background:var(--soft);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--c)}
.chap .meta{font-size:12.5px;color:var(--mute);margin-top:5px}
.chap.locked{opacity:.6}
.chap:after{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.sec{font-size:14px;color:#B7BCD1;margin:18px 2px 8px;font-weight:600}
.rev{background:#20253F;border-radius:16px;padding:14px}
.rev p{margin:0 0 10px;color:#D5D8E6;font-size:14.5px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.tagc{font-size:12.5px;background:#2D3457;color:#E8EAF3;border-radius:20px;padding:4px 10px}
.foot{font-size:12.5px;color:#8C92AB;text-align:center;margin-top:22px;line-height:1.5}
/* chapter list */
.top{display:flex;align-items:center;gap:10px;margin:2px 0 14px}
.back{background:#20253F;border:0;border-radius:12px;width:42px;height:42px;font-size:20px;flex:none}
.top h2{font-size:22px;flex:1}
.xp{background:#20253F;border-radius:12px;padding:8px 11px;font-weight:800;color:var(--gold);font-size:14px;white-space:nowrap}
.row{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:var(--page);color:var(--ink);border:0;border-radius:14px;padding:11px 12px;margin:0 0 8px}
.row .n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--soft);color:var(--ink)}
.row .n.ok{background:var(--leaf);color:#fff}.row .n.miss{background:#F6E2B8;color:#6A4A00}
.row b{display:block;font-size:15px;line-height:1.25}
.row small{display:block;font-size:12.5px;color:var(--mute);margin-top:2px}
.row .r{font-size:12px;color:var(--mute);text-align:right;white-space:nowrap}
.row.locked{opacity:.5}
/* play */
.play .chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.chip{font-size:12.5px;font-weight:700;border-radius:20px;padding:4px 10px;background:#2D3457;color:#E8EAF3}
.chip.d-Easy{background:#244A36;color:#CDEBD8}.chip.d-Medium{background:#4D3E12;color:#F5E1A6}.chip.d-Hard{background:#5A1E25;color:#F6CDD1}
.timer{height:8px;background:#2D3457;border-radius:4px;overflow:hidden;margin:0 0 12px}
.timer i{display:block;height:100%;background:var(--gold);transform-origin:left;width:100%}
.timer.low i{background:var(--fruit)}
.card{background:var(--page);color:var(--ink);border-radius:18px;padding:18px 16px}
.instr{font-size:13.5px;color:var(--mute);margin:0 0 6px}
.q{font-family:var(--serif);font-size:23px;line-height:1.25;margin:0 0 16px}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:13px 14px;margin:0 0 9px;font-size:16px;color:var(--ink)}
.opt.right{border-color:var(--leaf);background:#E5F2EA;font-weight:700}
.opt.wrong{border-color:var(--fruit);background:#F8E3E5}
.opt:disabled{cursor:default}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tf .opt{text-align:center;font-weight:800;font-size:19px;padding:18px}
.check{margin-top:14px}
/* order */
.ord{list-style:none;margin:0;padding:0}
.ord li{display:grid;grid-template-columns:28px 1fr 40px 40px;gap:6px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 8px 8px 10px;margin:0 0 7px;font-size:15px;cursor:pointer}
.ord li .k{font-weight:800;color:var(--mute);font-size:13px}
.ord li.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.ord li.ok{border-color:var(--leaf);background:#E5F2EA}.ord li.no{border-color:var(--fruit);background:#F8E3E5}
.ord button{border:0;background:var(--soft);border-radius:9px;height:36px;font-size:16px;color:var(--ink)}
.ord button:disabled{opacity:.3}
/* match */
.match{position:relative;display:grid;grid-template-columns:1fr 1fr;column-gap:44px;row-gap:8px;touch-action:none;user-select:none;-webkit-user-select:none}
.match.tap{column-gap:10px}
.match svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:2}
.mi{position:relative;border:2px solid var(--line);border-radius:11px;padding:9px;font-size:13.8px;line-height:1.25;font-weight:600;background:#fff;cursor:pointer;min-height:50px;display:flex;align-items:center}
.lines .mi.L{padding-right:16px}.lines .mi.R{padding-left:16px}
.mi .dot{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--firm);transform:translateY(-50%)}
.mi.L .dot{right:-9px}.mi.R .dot{left:-9px}
.mi .bd{position:absolute;top:-8px;right:-6px;min-width:22px;height:22px;border-radius:11px;color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center;padding:0 5px}
.mi.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.mi.ok{border-color:var(--leaf);background:#E5F2EA}.mi.no{border-color:var(--fruit);background:#F8E3E5}
/* sort */
.pool{display:flex;flex-wrap:wrap;gap:7px;min-height:54px;background:var(--soft);border:2px dashed #CFCBBE;border-radius:14px;padding:9px;margin:0 0 10px}
.pool .empty{font-size:13px;color:var(--mute);align-self:center}
.chipc{touch-action:none;user-select:none;-webkit-user-select:none;background:#fff;border:2px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px;font-weight:600;line-height:1.2;cursor:grab;color:var(--ink)}
.chipc.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.chipc.ok{border-color:var(--leaf);background:#E5F2EA}.chipc.no{border-color:var(--fruit);background:#F8E3E5}
.bks{display:grid;gap:8px}
.bks.c2{grid-template-columns:1fr 1fr}.bks.c3{grid-template-columns:1fr 1fr 1fr}
.bk{border:2px solid var(--line);background:#fff;border-radius:14px;padding:8px;min-height:92px}
.bk h4{margin:0 0 6px;font-size:13px;color:var(--firm);font-family:var(--sans)}
.bk .in{display:flex;flex-direction:column;gap:5px}
.bk .chipc{font-size:12.8px;padding:6px 8px}
.bk.over{border-color:var(--gold);background:#FFF8E6}
.ghost{position:fixed;pointer-events:none;z-index:80;transform:translate(-50%,-50%) rotate(-2deg);box-shadow:0 12px 26px rgba(0,0,0,.35)}
/* speed */
.sp{text-align:center}
.sp .cnt{font-size:13px;color:var(--mute);margin:0 0 8px}
.sp .st{font-family:var(--serif);font-size:24px;line-height:1.25;min-height:96px;display:flex;align-items:center;justify-content:center;margin:0 0 14px}
.sp .fl{min-height:44px;font-size:14px;margin:0 0 10px;font-weight:600}
/* feedback sheet */
.sheet{position:fixed;inset:0;background:rgba(10,12,24,.6);display:flex;align-items:flex-end;justify-content:center;z-index:60}
.sheet[hidden]{display:none}
.sheet .in{background:var(--page);color:var(--ink);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.vd{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.vd .ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:22px;color:#fff;flex:none}
.vd h3{font-size:24px}
.vd .gx{margin-left:auto;font-weight:800;color:#8A6500;background:#FBEFC8;border-radius:12px;padding:6px 10px;font-size:14px}
.fb{font-size:15.5px;line-height:1.5;margin:0 0 10px}
.fb.you{background:#F8E3E5;border-radius:12px;padding:10px 12px}
.fb.ans{background:#E5F2EA;border-radius:12px;padding:10px 12px}
.fb b{display:block;font-size:13px;margin-bottom:2px}
.lst{list-style:none;margin:0 0 10px;padding:0}
.lst li{font-size:14.5px;line-height:1.45;padding:8px 10px;border-radius:10px;margin:0 0 6px;background:#fff;border:1px solid var(--line)}
.lst li.no{background:#F8E3E5;border-color:#EBC3C7}.lst li.ok{background:#E5F2EA;border-color:#C5E0CF}
.ref{display:inline-block;font-weight:700;font-size:14px;color:var(--firm);background:#E7EAF5;border-radius:10px;padding:6px 10px;margin:2px 0 12px}
.rem{border-left:5px solid var(--gold);background:#FFF8E6;border-radius:0 12px 12px 0;padding:10px 12px;margin:0 0 14px}
.rem b{display:block;font-size:13px;color:#8A6500}
.rem p{margin:2px 0 0;font-family:var(--serif);font-size:17px;line-height:1.35}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts .btn{padding:13px 10px;font-size:15px}
.acts .wide{grid-column:1/-1}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;border:1px solid #444C70;padding:10px 16px;border-radius:12px;font-size:14px;z-index:90;max-width:90vw;text-align:center}
.toast[hidden]{display:none}
@media (prefers-reduced-motion:no-preference){.sheet .in{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="vdT"><div class="in" id="sheetIn"></div></div>
<div class="toast" id="toast" hidden></div>
<script>
var CH=[{"id":"G1-01","ch":1,"theme":"The opening verse","type":"Multiple Choice","mech":"mc","diff":"Easy","time":20,"xp":10,"tag":"Genesis 1 Basics","tt":"Medium","obj":"Recognise the Bible’s opening words.","instr":"Tap the right answer.","q":"How does the Bible begin?","opts":[{"t":"In the beginning God created the heavens and the earth","ok":1,"e":"Genesis 1:1 opens the whole Bible by naming God as the Creator of everything, ‘the heavens and the earth’."},{"t":"In the beginning was the Word","e":"That is how John’s Gospel begins (John 1:1). John deliberately echoes Genesis, but the Bible itself opens with God creating the heavens and the earth."},{"t":"Let there be light","e":"Close. These are God’s first recorded words, but they come in Genesis 1:3, the first command of Day 1, not in the opening verse."},{"t":"This is the account of the heavens and the earth","e":"That heading begins a new section at Genesis 2:4. The Bible’s first verse is Genesis 1:1: God created the heavens and the earth."}],"ref":"Genesis 1:1","rem":"Genesis 1:1: In the beginning God created the heavens and the earth."},{"id":"G1-02","ch":1,"theme":"Before Day 1","type":"True/False","mech":"tf","diff":"Easy","time":15,"xp":10,"tag":"Genesis 1 Basics","tt":"Low","obj":"Recall how Genesis describes the earth before Day 1.","instr":"True or false?","q":"Before God spoke light into being, the earth was formless and empty, with darkness over the deep.","ans":true,"ok":"Genesis 1:2 says exactly this: the earth was formless and empty, darkness was over the surface of the deep, and the Spirit of God was hovering over the waters.","no":"It is true. Genesis 1:2 describes the earth as formless and empty, with darkness over the deep and the Spirit of God hovering over the waters, before the first ‘Let there be’.","ref":"Genesis 1:2","rem":"Before Day 1: formless, empty, dark, and the Spirit of God over the waters."},{"id":"G1-03","ch":1,"theme":"Day 1","type":"Sequencing","mech":"order","diff":"Easy","time":35,"xp":10,"tag":"Creation Days","tt":"Medium","obj":"Follow the pattern of a creation day.","instr":"Put Day 1 in order, first at the top. Use the arrows, or tap two cards to swap.","q":"Put the events of Day 1 in order.","items":[{"t":"God said, ‘Let there be light’","r":"Genesis 1:3"},{"t":"And there was light","r":"Genesis 1:3"},{"t":"God saw that the light was good","r":"Genesis 1:4"},{"t":"God separated the light from the darkness","r":"Genesis 1:4"},{"t":"He called the light Day and the darkness Night","r":"Genesis 1:5"},{"t":"Evening and morning: the first day","r":"Genesis 1:5"}],"ok":"Day 1 shows the pattern of Genesis 1: God speaks, it happens, God sees it is good, separates, names, and the day closes.","ref":"Genesis 1:3–5","rem":"God speaks, it is so, it is good, separated, named, evening and morning."},{"id":"G1-04","ch":1,"theme":"Recognising Genesis 1","type":"Chapter Detective","mech":"mc","diff":"Medium","time":25,"xp":15,"tag":"Genesis Chapters","tt":"Medium","obj":"Identify Genesis 1 from its content.","instr":"Read the clue. Which chapter are you in?","q":"Clue: God separates light from darkness, gathers the waters into seas, and names what he made, day after day.","opts":[{"t":"Genesis 1","ok":1,"e":"Genesis 1 is the six-day account: light and darkness (1:3–5), the waters gathered into seas (1:9–10), and God naming what he made."},{"t":"Genesis 2","e":"Genesis 2 zooms in on the garden: the man formed from dust (2:7), Eden’s rivers and the woman. The separating and naming of days belongs to Genesis 1."},{"t":"Genesis 3","e":"Genesis 3 is the serpent, the eating of the fruit and the expulsion from Eden. Light, darkness and seas are Genesis 1."},{"t":"Genesis 4","e":"Genesis 4 begins with Cain and Abel, outside Eden. The separating of light and waters is Genesis 1."}],"ref":"Genesis 1:3–10","rem":"Genesis 1 = six days of creation and the seventh-day rest (continuing to 2:3)."},{"id":"G1-05","ch":1,"theme":"What God named","type":"Matching","mech":"match","lines":false,"diff":"Medium","time":40,"xp":15,"tag":"Creation Days","tt":"Medium","obj":"Match each part of creation to the name God gave it.","instr":"Tap a left card, then its match on the right.","q":"What did God call each of these?","L":["The light","The darkness","The expanse","The dry land","The gathered waters"],"R":["Day","Night","Heaven (sky)","Earth","Seas"],"ex":["God called the light Day (1:5).","God called the darkness Night (1:5).","God called the expanse Heaven, or sky (1:8).","God called the dry land Earth (1:10).","God called the gathered waters Seas (1:10)."],"ok":"God names day and night, sky, earth and seas across Days 1–3, showing his rule over every part of creation.","ref":"Genesis 1:5, 8, 10","rem":"Day, Night, Heaven, Earth, Seas: all named by God in Days 1–3."},{"id":"G1-06","ch":1,"theme":"Creation days","type":"Drag & Drop","mech":"sort","diff":"Medium","time":50,"xp":20,"tag":"Creation Days","tt":"High","obj":"Place each act of creation on its day.","instr":"Drag each card onto its day, or tap a card then a day.","q":"Which day was each one made?","buckets":["Day 1","Day 2","Day 3","Day 4","Day 5","Day 6"],"items":[{"t":"Light","b":0,"e":"Light came first, on Day 1 (1:3–5)."},{"t":"The expanse (sky)","b":1,"e":"The expanse separating the waters was made on Day 2 (1:6–8)."},{"t":"Dry land and seas","b":2,"e":"Waters gathered and dry land appeared on Day 3 (1:9–10)."},{"t":"Plants and fruit trees","b":2,"e":"Vegetation also came on Day 3 (1:11–13)."},{"t":"Sun, moon and stars","b":3,"e":"The lights in the heavens came on Day 4 (1:14–19)."},{"t":"Sea creatures","b":4,"e":"The waters teemed with life on Day 5 (1:20–23)."},{"t":"Birds","b":4,"e":"Birds were made alongside sea creatures on Day 5 (1:20–23)."},{"t":"Livestock and wild animals","b":5,"e":"Land animals came on Day 6 (1:24–25)."},{"t":"Humanity","b":5,"e":"Humanity was made on Day 6, after the land animals (1:26–31)."}],"ok":"Genesis 1 sets these creative acts across six days, followed by the seventh-day rest.","ref":"Genesis 1:3–31","rem":"Day 4: lights in the heavens. Day 6: land animals and humanity."},{"id":"G1-07","ch":1,"theme":"Creation sequence","type":"Sequencing","mech":"order","diff":"Medium","time":45,"xp":20,"tag":"Creation Days","tt":"High","obj":"Recall the order of the six days.","instr":"Put the days in order, first at the top. Use the arrows, or tap two cards to swap them.","q":"Can you put the six days of creation in order?","items":[{"t":"Light","r":"Day 1, Genesis 1:3–5"},{"t":"The sky separating the waters","r":"Day 2, Genesis 1:6–8"},{"t":"Dry land, seas and plants","r":"Day 3, Genesis 1:9–13"},{"t":"Sun, moon and stars","r":"Day 4, Genesis 1:14–19"},{"t":"Sea creatures and birds","r":"Day 5, Genesis 1:20–23"},{"t":"Land animals and humanity","r":"Day 6, Genesis 1:24–31"}],"ok":"Light, sky, land and plants, lights, sea and sky creatures, land creatures and humanity: the six days of Genesis 1.","ref":"Genesis 1:3–31","rem":"Light, sky, land; lights, sea and air, land and people."},{"id":"G1-08","ch":1,"theme":"Filling the creation","type":"Connect-the-Line","mech":"match","lines":true,"diff":"Medium","time":45,"xp":20,"tag":"Creation Days","tt":"Medium","obj":"Connect living creatures to the realm God gave them.","instr":"Draw a line from each creature to its realm.","q":"Where did God tell each of these to live and multiply?","L":["Sea creatures","Birds","Livestock and creeping things","Humanity"],"R":["Fill the waters in the seas","Fly above the earth across the sky","Come from the land, each after its kind","Fill the earth and rule over the creatures"],"ex":["God blessed the sea creatures: ‘fill the waters in the seas’ (1:22).","Birds fly above the earth across the expanse of the sky (1:20).","The land brought forth livestock, creeping things and wild animals (1:24).","Humanity is told to fill the earth and rule over fish, birds and every living creature (1:28)."],"ok":"Each creature is placed in its own realm: sea, sky and land, with humanity given responsibility over them all.","ref":"Genesis 1:20–28","rem":"Seas, sky, land, and humanity given dominion over them."},{"id":"G1-09","ch":1,"theme":"Sun, moon and stars","type":"True/False","mech":"tf","diff":"Medium","time":15,"xp":15,"tag":"Creation Days","tt":"High","obj":"Correct a common mix-up about Day 1 and Day 4.","instr":"True or false?","q":"The sun, moon and stars were created on Day 1.","ans":false,"ok":"Right, it is false. Light appears on Day 1 (1:3–5), but the greater light, the lesser light and the stars are made on Day 4 (1:14–19).","no":"A very common mix-up. Day 1 brings light (1:3–5); the sun, moon and stars come on Day 4 (1:14–19).","ref":"Genesis 1:3–5; 1:14–19","rem":"Light on Day 1; sun, moon and stars on Day 4."},{"id":"G1-10","ch":1,"theme":"Days 3–6 review","type":"Speed Round","mech":"speed","diff":"Medium","time":35,"xp":20,"tag":"Creation Days","tt":"High","obj":"Recall creation details quickly.","instr":"True or false, fast. The clock is running.","q":"Six quick calls on Genesis 1.","rounds":[{"q":"Fruit trees appeared on Day 3.","a":true,"e":"True: plants and fruit trees came on Day 3 (1:11–13)."},{"q":"Birds were made on Day 6.","a":false,"e":"False: birds were made on Day 5, with the sea creatures (1:20–23)."},{"q":"God blessed the sea creatures and birds: be fruitful and multiply.","a":true,"e":"True: Genesis 1:22."},{"q":"The greater light rules the night.","a":false,"e":"False: the greater light rules the day, the lesser light the night (1:16)."},{"q":"God saw that the land animals were good.","a":true,"e":"True: Genesis 1:25."},{"q":"Humanity was made on Day 5.","a":false,"e":"False: humanity was made on Day 6 (1:26–31)."}],"ok":"Fast recall of Days 3 to 6 builds a solid map of Genesis 1.","ref":"Genesis 1:11–31","rem":"Day 5: sea and sky creatures. Day 6: land animals and humanity."},{"id":"G1-11","ch":1,"theme":"The image of God","type":"Multiple Choice","mech":"mc","diff":"Medium","time":25,"xp":15,"tag":"Humanity","tt":"Medium","obj":"Recall who is made in God’s image.","instr":"Tap the right answer.","q":"According to Genesis 1:27, who was created in the image of God?","opts":[{"t":"Male and female","ok":1,"e":"Genesis 1:27: God created mankind in his own image, ‘male and female he created them’. Both share in the image of God."},{"t":"Only the man","e":"Genesis 1:27 explicitly says ‘male and female he created them’ in God’s image. The image is not limited to the man."},{"t":"Humans and animals alike","e":"Animals are made ‘according to their kinds’ (1:24–25). Only humanity is said to be made in God’s image (1:26–27)."},{"t":"The angels","e":"Genesis 1 does not mention angels. The image of God is said of humanity, male and female (1:26–27)."}],"ref":"Genesis 1:26–27","rem":"Male and female: both created in God’s image."},{"id":"G1-12","ch":1,"theme":"Blessing and provision","type":"Matching","mech":"match","lines":false,"diff":"Medium","time":40,"xp":15,"tag":"Humanity","tt":"Low","obj":"Match what God said to each part of creation.","instr":"Tap a left card, then its match on the right.","q":"What did God say or give to each?","L":["Sea creatures and birds","Humanity","Green plants","The seventh day"],"R":["Blessed: be fruitful and fill the waters","Blessed: fill the earth and subdue it","Given as food for animals and birds","Blessed and made holy"],"ex":["God blessed the creatures of sea and sky: be fruitful, multiply and fill the waters (1:22).","God blessed humanity: be fruitful, fill the earth and subdue it (1:28).","Every green plant was given as food for the animals and birds (1:30).","God blessed the seventh day and made it holy (2:3)."],"ok":"God blesses living creatures, gives humanity its task, provides food, and blesses the seventh day.","ref":"Genesis 1:22, 28–30; 2:3","rem":"Three blessings: sea and sky creatures, humanity, and the seventh day."},{"id":"G1-13","ch":1,"theme":"Humanity’s task","type":"What Comes Next?","mech":"mc","diff":"Medium","time":25,"xp":15,"tag":"Humanity","tt":"Medium","obj":"Recall what follows the creation of humanity.","instr":"Pick what happens next.","q":"God has just created mankind in his image, male and female (1:27). What happens next?","opts":[{"t":"God blesses them: be fruitful, fill the earth and subdue it","ok":1,"e":"Straight after 1:27, God blesses them and gives them their task: be fruitful, multiply, fill the earth, subdue it and rule over the creatures (1:28)."},{"t":"God rests from his work","e":"The rest comes later, on the seventh day (2:2). First God blesses humanity, gives food and sees that everything is very good (1:28–31)."},{"t":"God plants a garden in Eden","e":"The garden appears in Genesis 2:8, in the closer account of the man’s formation. Genesis 1:28 continues with God’s blessing."},{"t":"God makes the sun and moon","e":"The lights were made on Day 4 (1:14–19), before humanity on Day 6."}],"ref":"Genesis 1:27–28","rem":"Image of God (1:27), then blessing and responsibility (1:28)."},{"id":"G1-14","ch":1,"theme":"Day 6 in order","type":"Sequencing","mech":"order","diff":"Hard","time":50,"xp":25,"tag":"Biblical Sequence","tt":"Medium","obj":"Sequence the events of Day 6.","instr":"Put Day 6 in order, first at the top.","q":"Put the events of Day 6 in the order Genesis gives them.","items":[{"t":"Land animals made","r":"Genesis 1:24–25"},{"t":"God says: Let us make mankind in our image","r":"Genesis 1:26"},{"t":"Mankind created, male and female","r":"Genesis 1:27"},{"t":"God blesses them and gives them their task","r":"Genesis 1:28"},{"t":"God gives plants for food","r":"Genesis 1:29–30"},{"t":"God sees all he made: very good","r":"Genesis 1:31"}],"ok":"Day 6 moves from land animals, to God’s purpose and creation of humanity, to blessing, provision and ‘very good’.","ref":"Genesis 1:24–31","rem":"Day 6 ends with ‘very good’ (1:31)."},{"id":"G1-15","ch":1,"theme":"Genesis 1 or not?","type":"Drag & Drop","mech":"sort","diff":"Hard","time":55,"xp":25,"tag":"Genesis Chapters","tt":"Medium","obj":"Distinguish Genesis 1 from Genesis 2.","instr":"Drag each statement into the right box, or tap a card then a box.","q":"Is each statement found in Genesis 1?","buckets":["In Genesis 1","Not in Genesis 1"],"items":[{"t":"God said, ‘Let there be light’","b":0,"e":"Genesis 1:3."},{"t":"The Spirit of God hovered over the waters","b":0,"e":"Genesis 1:2."},{"t":"Male and female he created them","b":0,"e":"Genesis 1:27."},{"t":"Everything God made was very good","b":0,"e":"Genesis 1:31."},{"t":"God formed the man from dust","b":1,"e":"That is Genesis 2:7, in the closer account of the man’s formation."},{"t":"God planted a garden in Eden","b":1,"e":"That is Genesis 2:8."},{"t":"God brought the animals to the man to be named","b":1,"e":"That is Genesis 2:19."},{"t":"It is not good for the man to be alone","b":1,"e":"That is Genesis 2:18."}],"ok":"Genesis 1 gives the six days; Genesis 2 zooms in on the man, the garden and the woman.","ref":"Genesis 1:2–31; 2:7–19","rem":"Genesis 1: ‘Let there be’. Genesis 2: dust, garden, naming."},{"id":"G1-16","ch":1,"theme":"‘It was good’","type":"Multiple Choice","mech":"mc","diff":"Hard","time":25,"xp":25,"tag":"Creation Days","tt":"High","obj":"Notice a detail of the text: where ‘it was good’ appears.","instr":"Tap the right answer.","q":"Which day of creation does NOT include the words ‘God saw that it was good’?","opts":[{"t":"Day 2","ok":1,"e":"In Genesis 1:6–8 the expanse is made and named, but ‘it was good’ is not said. Every other day of the six includes it (in the Hebrew text most English Bibles follow)."},{"t":"Day 1","e":"Day 1 has it: ‘God saw that the light was good’ (1:4)."},{"t":"Day 3","e":"Day 3 has it twice: after the land and seas (1:10) and after the plants (1:12)."},{"t":"Day 6","e":"Day 6 has it after the land animals (1:25), and ends with ‘very good’ (1:31)."}],"ref":"Genesis 1:4–31","rem":"‘It was good’ appears on every day except Day 2; Day 3 has it twice."},{"id":"G2-01","ch":2,"theme":"The seventh day","type":"Multiple Choice","mech":"mc","diff":"Easy","time":20,"xp":10,"tag":"Sabbath Rest","tt":"Medium","obj":"Recall what God did on the seventh day.","instr":"Tap the right answer.","q":"What did God do on the seventh day?","opts":[{"t":"He rested from all his work","ok":1,"e":"God finished his work and rested on the seventh day; he blessed it and made it holy (2:2–3)."},{"t":"He created humanity","e":"Humanity was created on Day 6 (1:26–31). On the seventh day God rested (2:2)."},{"t":"He planted the garden of Eden","e":"The garden is described in 2:8, but the text does not tie it to the seventh day. The seventh day is described as rest (2:2–3)."},{"t":"He gave the Ten Commandments","e":"That is Exodus 20. The Sabbath command there points back to creation’s seventh day (Exodus 20:11)."}],"ref":"Genesis 2:1–3","rem":"Day 7: God rested, blessed the day and made it holy."},{"id":"G2-02","ch":2,"theme":"The seventh day","type":"Sequencing","mech":"order","diff":"Easy","time":35,"xp":10,"tag":"Sabbath Rest","tt":"Low","obj":"Sequence the seventh day and the new heading.","instr":"Put these in order, first at the top.","q":"Put Genesis 2:1–4 in order.","items":[{"t":"The heavens and the earth are finished","r":"Genesis 2:1"},{"t":"On the seventh day God finishes his work","r":"Genesis 2:2"},{"t":"He rests from all his work","r":"Genesis 2:2"},{"t":"God blesses the seventh day and makes it holy","r":"Genesis 2:3"},{"t":"‘This is the account of the heavens and the earth’","r":"Genesis 2:4"}],"ok":"Creation is completed, God rests and blesses the seventh day, and 2:4 opens a new account.","ref":"Genesis 2:1–4","rem":"Finished, rested, blessed, made holy; then a new account (2:4)."},{"id":"G2-03","ch":2,"theme":"The man and the woman","type":"Drag & Drop","mech":"sort","diff":"Easy","time":45,"xp":10,"tag":"Adam and Eve","tt":"Medium","obj":"Distinguish how the man and the woman were made.","instr":"Drag each card to the man or the woman, or tap a card then a box.","q":"Which is said of the man, and which of the woman?","buckets":["The man","The woman"],"items":[{"t":"Formed from the dust of the ground","b":0,"e":"The LORD God formed the man from dust (2:7)."},{"t":"Breath of life breathed into his nostrils","b":0,"e":"Genesis 2:7: the man became a living being."},{"t":"Gave names to the animals","b":0,"e":"The man named livestock, birds and beasts of the field (2:20)."},{"t":"Made from a rib","b":1,"e":"God made the woman from the rib he took from the man (2:22)."},{"t":"Brought by God to the man","b":1,"e":"God brought her to the man (2:22)."},{"t":"Called Woman, ‘taken out of Man’","b":1,"e":"The man named her Woman (2:23)."}],"ok":"The man: dust, breath and naming. The woman: made from the rib, brought to the man, and called Woman.","ref":"Genesis 2:7, 19–23","rem":"Man from dust (2:7); woman from the rib (2:22)."},{"id":"G2-04","ch":2,"theme":"Recognising Genesis 2","type":"Chapter Detective","mech":"mc","diff":"Medium","time":25,"xp":15,"tag":"Genesis Chapters","tt":"Low","obj":"Identify Genesis 2 from its content.","instr":"Read the clue. Which chapter are you in?","q":"Clue: God is now called ‘the LORD God’. A man is formed from dust, and a garden is planted in the east.","opts":[{"t":"Genesis 2","ok":1,"e":"From 2:4 the title ‘the LORD God’ is used; the man is formed from dust (2:7) and the garden planted eastward in Eden (2:8)."},{"t":"Genesis 1","e":"Genesis 1 uses ‘God’ throughout and describes the six days. No dust and no garden."},{"t":"Genesis 3","e":"Genesis 3 also says ‘the LORD God’, but it tells of the serpent and the fall. The garden already exists there."},{"t":"Genesis 4","e":"Genesis 4 opens with Cain and Abel, after Eden."}],"ref":"Genesis 2:4–8","rem":"Genesis 2: the LORD God, dust, breath, garden."},{"id":"G2-05","ch":2,"theme":"Adam’s work","type":"Multiple Choice","mech":"mc","diff":"Medium","time":25,"xp":15,"tag":"Eden","tt":"Medium","obj":"Recall the man’s task in Eden.","instr":"Tap the right answer.","q":"Why did the LORD God put the man in the garden of Eden?","opts":[{"t":"To work it and take care of it","ok":1,"e":"Genesis 2:15: the man was placed in Eden to work it and keep it. Work is part of life before the fall."},{"t":"To rest and do nothing","e":"Genesis 2:15 gives the man work: to work the garden and keep it, before any sin enters."},{"t":"To guard the tree of life from the serpent","e":"Guarding the way to the tree of life is done by the cherubim and a flaming sword, after the expulsion (3:24)."},{"t":"To build a city","e":"The first city in Genesis is built by Cain (4:17). The man’s task in Eden was to work and keep the garden (2:15)."}],"ref":"Genesis 2:15","rem":"Work began in Eden, before the fall (2:15)."},{"id":"G2-06","ch":2,"theme":"The command","type":"Story Reconstruction","mech":"order","diff":"Medium","time":45,"xp":15,"tag":"Eden","tt":"Medium","obj":"Rebuild the man’s placement and God’s command.","instr":"Rebuild the passage, first at the top.","q":"Rebuild Genesis 2:15–17 in order.","items":[{"t":"The LORD God takes the man","r":"Genesis 2:15"},{"t":"He puts him in Eden to work it and keep it","r":"Genesis 2:15"},{"t":"You may freely eat of every tree of the garden","r":"Genesis 2:16"},{"t":"But not of the tree of the knowledge of good and evil","r":"Genesis 2:17"},{"t":"In the day you eat of it you will surely die","r":"Genesis 2:17"}],"ok":"A place, a task, a generous permission, one prohibition and a warning. All of this comes before the woman is made (2:22).","ref":"Genesis 2:15–17","rem":"Work and keep; eat freely; one tree forbidden; a warning."},{"id":"G2-07","ch":2,"theme":"The command concerning the tree","type":"Matching","mech":"match","lines":false,"diff":"Medium","time":40,"xp":15,"tag":"Eden","tt":"Medium","obj":"Recall exactly what God allowed and forbade.","instr":"Tap a left card, then its match on the right.","q":"Match each part of God’s command in Genesis 2:16–17.","L":["Every tree of the garden","The tree of the knowledge of good and evil","The day you eat of it","The tree of life"],"R":["You may freely eat","You must not eat from it","You will surely die","Not forbidden in this command"],"ex":["God said the man could freely eat from every tree of the garden (2:16).","Only the tree of the knowledge of good and evil was forbidden (2:17).","The warning: in the day you eat of it you will surely die (2:17).","The tree of life stood in the garden (2:9) but is not part of the prohibition in 2:16–17."],"ok":"God’s command was generous and clear: every tree allowed, one tree forbidden, with a warning.","ref":"Genesis 2:9, 16–17","rem":"Every tree allowed; one forbidden: the knowledge of good and evil."},{"id":"G2-08","ch":2,"theme":"Rivers of Eden","type":"Connect-the-Line","mech":"match","lines":true,"diff":"Medium","time":45,"xp":20,"tag":"Eden","tt":"Low","obj":"Connect the four rivers to their descriptions.","instr":"Draw a line from each river to its description.","q":"A river flowed out of Eden and divided into four. Connect each one.","L":["Pishon","Gihon","Tigris (Hiddekel)","Euphrates"],"R":["Flows around Havilah, where there is gold","Flows around the land of Cush","Runs east of Assyria","Named as the fourth river"],"ex":["The Pishon winds through Havilah, land of gold, bdellium and onyx (2:11–12).","The Gihon winds through the land of Cush (2:13).","The Tigris runs east of Assyria (2:14).","The fourth river is the Euphrates (2:14)."],"ok":"Genesis places Eden in a real geography, with a river dividing into four.","ref":"Genesis 2:10–14","rem":"Pishon, Gihon, Tigris, Euphrates."},{"id":"G2-09","ch":2,"theme":"Formation and placement","type":"Sequencing","mech":"order","diff":"Medium","time":45,"xp":20,"tag":"Biblical Sequence","tt":"Medium","obj":"Sequence the man’s formation and placement in Eden.","instr":"Put these in order, first at the top.","q":"Put these Genesis 2 events in the order the text gives them.","items":[{"t":"God forms the man from dust","r":"Genesis 2:7"},{"t":"God breathes the breath of life into him","r":"Genesis 2:7"},{"t":"God plants a garden in Eden and puts the man there","r":"Genesis 2:8"},{"t":"The tree of life and the tree of knowledge grow in the garden","r":"Genesis 2:9"},{"t":"God commands: do not eat from the tree of knowledge","r":"Genesis 2:16–17"}],"ok":"Formed, given life, placed in the garden, surrounded by trees, then given one command.","ref":"Genesis 2:7–17","rem":"Dust, breath, garden, trees, command."},{"id":"G2-10","ch":2,"theme":"The need for a companion","type":"Multiple Choice","mech":"mc","diff":"Medium","time":25,"xp":15,"tag":"Adam and Eve","tt":"High","obj":"Recall the first thing God calls ‘not good’.","instr":"Tap the right answer.","q":"What did God say was ‘not good’ in Genesis 2?","opts":[{"t":"That the man should be alone","ok":1,"e":"Genesis 2:18: ‘It is not good that the man should be alone; I will make him a helper fit for him.’ The first ‘not good’ in the Bible."},{"t":"That the man had to work","e":"Work was God’s own assignment (2:15). What was not good was the man being alone (2:18)."},{"t":"The tree of knowledge","e":"God forbade eating from it (2:17) but never calls the tree ‘not good’. The ‘not good’ is the man’s aloneness (2:18)."},{"t":"The darkness","e":"Genesis 2 doesn’t say this. In Genesis 1 God separates light from darkness and calls the light good (1:4)."}],"ref":"Genesis 2:18","rem":"The first ‘not good’: the man alone (2:18)."},{"id":"G2-11","ch":2,"theme":"Naming the animals","type":"Drag & Drop","mech":"sort","diff":"Medium","time":50,"xp":20,"tag":"Adam and Eve","tt":"Medium","obj":"Recall exactly which creatures the man named in 2:20.","instr":"Drag each card into the right box, or tap a card then a box.","q":"Which does Genesis 2:20 say the man gave names to?","buckets":["Named in 2:20","Not in the 2:20 list"],"items":[{"t":"Livestock","b":0,"e":"Yes: the man gave names to all livestock (2:20)."},{"t":"Birds of the air","b":0,"e":"Yes: and to the birds of the air (2:20)."},{"t":"Beasts of the field","b":0,"e":"Yes: and to every beast of the field (2:20)."},{"t":"Fish of the sea","b":1,"e":"Fish are not mentioned in 2:19–20. The list is livestock, birds and beasts of the field."},{"t":"Trees and plants","b":1,"e":"Genesis 2 does not describe the man naming plants."},{"t":"The woman","b":1,"e":"He does name her, ‘Woman’ (2:23) and later ‘Eve’ (3:20), but not in the 2:20 list."}],"ok":"The man named livestock, birds and beasts of the field, yet no suitable helper was found among them.","ref":"Genesis 2:19–20, 23; 3:20","rem":"Named in 2:20: livestock, birds, beasts of the field."},{"id":"G2-12","ch":2,"theme":"The woman","type":"What Comes Next?","mech":"mc","diff":"Medium","time":25,"xp":15,"tag":"Adam and Eve","tt":"Medium","obj":"Recall how God answered the man’s need.","instr":"Pick what happens next.","q":"No suitable helper was found among the animals (2:20). What does God do next?","opts":[{"t":"Causes a deep sleep and takes one of the man’s ribs","ok":1,"e":"The LORD God caused a deep sleep to fall on the man, took one of his ribs and closed up the flesh (2:21)."},{"t":"Makes more animals","e":"No suitable helper was found among the animals. God’s answer is the deep sleep and the making of the woman (2:21–22)."},{"t":"Sends the man out of the garden","e":"That happens in 3:23, after the eating. Here God provides a companion (2:21–22)."},{"t":"Forms the woman from dust","e":"The man was formed from dust (2:7). The woman was made from the rib taken from the man (2:22)."}],"ref":"Genesis 2:20–22","rem":"Deep sleep, a rib, then the woman (2:21–22)."},{"id":"G2-13","ch":2,"theme":"One flesh","type":"Connect-the-Line","mech":"match","lines":true,"diff":"Medium","time":45,"xp":20,"tag":"Adam and Eve","tt":"Medium","obj":"Complete the key sayings of Genesis 2:23–25.","instr":"Draw a line from each beginning to its ending.","q":"Complete each saying.","L":["Bone of my bones","She shall be called Woman","A man shall leave his father and mother","The man and his wife were both naked"],"R":["and flesh of my flesh","because she was taken out of Man","and hold fast to his wife; they become one flesh","and were not ashamed"],"ex":["The man’s first words on seeing the woman (2:23).","He names her Woman, for she was taken out of Man (2:23).","The text draws the lesson of marriage: leaving, holding fast, one flesh (2:24).","Before the fall they were naked and not ashamed (2:25)."],"ok":"Genesis 2 ends with unity: shared flesh, a new household, and no shame.","ref":"Genesis 2:23–25","rem":"Leave, hold fast, one flesh (2:24)."},{"id":"G2-14","ch":2,"theme":"The woman’s creation","type":"Story Reconstruction","mech":"order","diff":"Hard","time":55,"xp":25,"tag":"Adam and Eve","tt":"High","obj":"Rebuild the story of the woman’s creation.","instr":"Rebuild the story, first at the top.","q":"Rebuild Genesis 2:18–24 in order.","items":[{"t":"God says it is not good for the man to be alone","r":"Genesis 2:18"},{"t":"God brings the animals to the man to name","r":"Genesis 2:19"},{"t":"No suitable helper is found","r":"Genesis 2:20"},{"t":"A deep sleep; one rib is taken","r":"Genesis 2:21"},{"t":"God makes the woman and brings her to the man","r":"Genesis 2:22"},{"t":"The man: bone of my bones","r":"Genesis 2:23"},{"t":"The two become one flesh","r":"Genesis 2:24"}],"ok":"A need, a search, a sleep, a gift, a joyful response, and the principle of one flesh.","ref":"Genesis 2:18–24","rem":"Alone, animals, no helper, sleep, woman, joy, one flesh."},{"id":"G2-15","ch":2,"theme":"Genesis 2 review","type":"Speed Round","mech":"speed","diff":"Hard","time":35,"xp":25,"tag":"Eden","tt":"High","obj":"Recall Genesis 2 details quickly.","instr":"True or false, fast.","q":"Six quick calls on Genesis 2.","rounds":[{"q":"God formed the man from dust.","a":true,"e":"True: Genesis 2:7."},{"q":"The garden was planted in the east, in Eden.","a":true,"e":"True: Genesis 2:8."},{"q":"The river from Eden divided into four.","a":true,"e":"True: Genesis 2:10."},{"q":"The woman was formed from dust.","a":false,"e":"False: she was made from the man’s rib (2:22)."},{"q":"The man named the animals.","a":true,"e":"True: Genesis 2:19–20."},{"q":"The man and his wife were ashamed in Genesis 2.","a":false,"e":"False: they were naked and not ashamed (2:25)."}],"ok":"Fast recall of Genesis 2 builds a solid picture of Eden before the fall.","ref":"Genesis 2:7–25","rem":"Dust, garden, four rivers, rib, names, no shame."},{"id":"G2-16","ch":2,"theme":"A distinct account","type":"Multiple Choice","mech":"mc","diff":"Hard","time":25,"xp":25,"tag":"Genesis Chapters","tt":"Low","obj":"Recognise the heading that opens the Genesis 2 account.","instr":"Tap the right answer.","q":"Which words in Genesis 2:4 mark the start of a new account?","opts":[{"t":"This is the account of the heavens and the earth","ok":1,"e":"Genesis 2:4 opens with ‘these are the generations’ (or ‘account’) of the heavens and the earth: the first of the ‘generations’ headings that structure Genesis."},{"t":"In the beginning","e":"That opens Genesis 1:1, not the account starting at 2:4."},{"t":"And God said, ‘Let there be…’","e":"That is the repeated formula of the six days in Genesis 1."},{"t":"Now the serpent was more crafty","e":"Those words open Genesis 3:1."}],"ref":"Genesis 2:4","rem":"2:4 begins a new section; ‘the LORD God’ is used from here."},{"id":"G3-01","ch":3,"theme":"The voices of Genesis 3","type":"Sequencing","mech":"order","diff":"Easy","time":35,"xp":10,"tag":"The Fall","tt":"Medium","obj":"Recall who speaks, and in what order.","instr":"Put the speakers in order, first at the top.","q":"Who speaks first in Genesis 3? Put them in order.","items":[{"t":"The serpent: ‘Did God really say…?’","r":"Genesis 3:1"},{"t":"The woman: ‘We may eat fruit from the trees…’","r":"Genesis 3:2"},{"t":"The LORD God: ‘Where are you?’","r":"Genesis 3:9"},{"t":"The man: ‘I was afraid’","r":"Genesis 3:10"}],"ok":"The serpent speaks first, then the woman. God speaks only after the eating, and the man answers in fear.","ref":"Genesis 3:1–10","rem":"Serpent, woman, God, man."},{"id":"G3-02","ch":3,"theme":"The fruit","type":"True/False","mech":"tf","diff":"Easy","time":15,"xp":10,"tag":"The Fall","tt":"High","obj":"Separate the text from popular tradition.","instr":"True or false?","q":"Genesis 3 says the forbidden fruit was an apple.","ans":false,"ok":"Right, it is false. Genesis only says ‘the fruit of the tree’ (3:3, 3:6). The apple is a later tradition, not a detail of the text.","no":"The text never names the fruit, only ‘the fruit of the tree’ (3:3, 3:6). The apple comes from later art and tradition.","ref":"Genesis 3:3, 6","rem":"Genesis never says ‘apple’."},{"id":"G3-03","ch":3,"theme":"Who is described?","type":"Matching","mech":"match","lines":false,"diff":"Easy","time":40,"xp":10,"tag":"The Fall","tt":"Medium","obj":"Match each figure to how Genesis describes them.","instr":"Tap a left card, then its match on the right.","q":"Match each one to its description.","L":["The serpent","Eve","The man","The cherubim"],"R":["More crafty than any beast of the field","Mother of all the living","From dust, and to dust he will return","Placed at the east of the garden"],"ex":["The serpent was more crafty than any beast of the field (3:1). The text does not name it Satan; that link comes from later Scripture (interpretation).","The man named his wife Eve, because she was the mother of all the living (3:20).","Formed from dust (2:7); ‘to dust you shall return’ (3:19).","Cherubim were placed at the east of the garden to guard the way (3:24)."],"ok":"Four figures, four descriptions straight from the text of Genesis 2–3.","ref":"Genesis 3:1, 19, 20, 24","rem":"Eve: mother of all the living (3:20)."},{"id":"G3-04","ch":3,"theme":"Who said it?","type":"Matching","mech":"match","lines":false,"diff":"Medium","time":40,"xp":15,"tag":"The Fall","tt":"High","obj":"Match key words of Genesis 3 to their speakers.","instr":"Tap a quote, then who said it.","q":"Who said it?","L":["‘Did God really say…?’","‘We may eat fruit from the trees of the garden’","‘Where are you?’","‘I heard you in the garden, and I was afraid’"],"R":["The serpent","The woman","The LORD God","The man"],"ex":["The serpent’s opening question (3:1).","The woman’s reply to the serpent (3:2).","God calls to the man after they hide (3:9).","The man’s answer (3:10)."],"ok":"Four voices, four moments: the question, the reply, God’s call and the man’s fear.","ref":"Genesis 3:1–10","rem":"Serpent questions; woman replies; God calls; man is afraid."},{"id":"G3-05","ch":3,"theme":"The command retold","type":"Multiple Choice","mech":"mc","diff":"Medium","time":25,"xp":15,"tag":"The Fall","tt":"High","obj":"Compare the woman’s words with God’s command.","instr":"Tap the right answer.","q":"Which words in the woman’s reply (3:3) are NOT recorded in God’s command in 2:16–17?","opts":[{"t":"‘You must not touch it’","ok":1,"e":"In 3:3 she says they must not eat it or touch it. The command recorded in 2:16–17 forbids eating; touching is not mentioned."},{"t":"‘You will die’","e":"The warning of death is in God’s command: ‘you will surely die’ (2:17). She says ‘lest you die’ (3:3)."},{"t":"‘You may eat from the trees of the garden’","e":"That matches God’s permission (2:16). She uses it to correct the serpent’s twisted question (3:1–2)."},{"t":"‘Only on the seventh day’","e":"Nothing like this is in Genesis 2–3. The seventh day is about God’s rest (2:2–3), not the tree."}],"ref":"Genesis 2:16–17; 3:2–3","rem":"2:17 forbids eating; ‘touch’ first appears in 3:3."},{"id":"G3-06","ch":3,"theme":"Temptation and eating","type":"Sequencing","mech":"order","diff":"Medium","time":45,"xp":20,"tag":"The Fall","tt":"High","obj":"Sequence the temptation and the eating.","instr":"Put these in order, first at the top.","q":"Put the temptation in order.","items":[{"t":"The serpent questions what God said","r":"Genesis 3:1"},{"t":"The woman replies","r":"Genesis 3:2–3"},{"t":"The serpent: you will not surely die","r":"Genesis 3:4–5"},{"t":"She sees the fruit is good, pleasing and desirable","r":"Genesis 3:6"},{"t":"She eats and gives some to her husband","r":"Genesis 3:6"},{"t":"Their eyes are opened; fig-leaf coverings","r":"Genesis 3:7"}],"ok":"A question, a reply, a denial, desire, eating, and opened eyes.","ref":"Genesis 3:1–7","rem":"Question, denial, desire, eating, awareness."},{"id":"G3-07","ch":3,"theme":"Objects of Genesis 3","type":"Connect-the-Line","mech":"match","lines":true,"diff":"Medium","time":45,"xp":20,"tag":"The Fall","tt":"Medium","obj":"Connect the objects of Genesis 3 to their role.","instr":"Draw a line from each object to its role.","q":"Connect each object to what Genesis 3 says about it.","L":["Fig leaves","Garments of skin","Thorns and thistles","A flaming sword"],"R":["Sewn into coverings by the man and woman","Made by the LORD God to clothe them","What the cursed ground will produce","Turns every way to guard the tree of life"],"ex":["After eating, they sewed fig leaves together to cover themselves (3:7).","The LORD God made garments of skin and clothed them (3:21).","The ground will bring forth thorns and thistles (3:18).","Cherubim and a flaming sword guard the way to the tree of life (3:24)."],"ok":"Human coverings, God’s clothing, a cursed ground and a guarded way: four images of Genesis 3.","ref":"Genesis 3:7, 18, 21, 24","rem":"Fig leaves (human), skins (God), thorns (ground), sword (guard)."},{"id":"G3-08","ch":3,"theme":"Hiding","type":"What Comes Next?","mech":"mc","diff":"Medium","time":25,"xp":15,"tag":"The Fall","tt":"Medium","obj":"Recall the first response to God after the eating.","instr":"Pick what happens next.","q":"They hear the LORD God walking in the garden in the cool of the day (3:8). What do they do?","opts":[{"t":"Hide among the trees","ok":1,"e":"The man and his wife hid from the presence of the LORD God among the trees of the garden (3:8)."},{"t":"Run to meet him","e":"The text says they hid from his presence among the trees (3:8)."},{"t":"Leave the garden at once","e":"They leave only when God sends them out (3:23–24)."},{"t":"Offer a sacrifice","e":"No sacrifice appears in Genesis 3. The first offerings recorded are Cain’s and Abel’s (4:3–4)."}],"ref":"Genesis 3:8","rem":"After eating: hiding among the trees (3:8)."},{"id":"G3-09","ch":3,"theme":"God’s questions","type":"Drag & Drop","mech":"sort","diff":"Medium","time":55,"xp":20,"tag":"The Fall","tt":"Medium","obj":"Separate God’s questions from the man’s and woman’s answers.","instr":"Drag each card into the right box, or tap a card then a box.","q":"Who said each of these in Genesis 3:9–13?","buckets":["God asked","The man answered","The woman answered"],"items":[{"t":"Where are you?","b":0,"e":"God’s first question to the man (3:9)."},{"t":"Who told you that you were naked?","b":0,"e":"God’s question (3:11)."},{"t":"Have you eaten from the tree?","b":0,"e":"God’s question (3:11)."},{"t":"What is this you have done?","b":0,"e":"God’s question to the woman (3:13)."},{"t":"I was afraid because I was naked","b":1,"e":"The man’s answer (3:10)."},{"t":"The woman you put here gave me fruit","b":1,"e":"The man’s answer (3:12)."},{"t":"The serpent deceived me, and I ate","b":2,"e":"The woman’s answer (3:13)."}],"ok":"God questions; the man points to the woman; the woman points to the serpent.","ref":"Genesis 3:9–13","rem":"Four questions from God; the answers shift the blame."},{"id":"G3-10","ch":3,"theme":"Recognising Genesis 3","type":"Chapter Detective","mech":"mc","diff":"Medium","time":25,"xp":15,"tag":"Genesis Chapters","tt":"Medium","obj":"Identify Genesis 3 from its content.","instr":"Read the clue. Which chapter are you in?","q":"Clue: thorns and thistles, the sweat of the face, and ‘dust you are’.","opts":[{"t":"Genesis 3","ok":1,"e":"These come in the man’s consequence: cursed ground, thorns and thistles, sweat, and return to dust (3:17–19)."},{"t":"Genesis 1","e":"In Genesis 1 plants are given as food and everything is ‘very good’ (1:29–31). No thorns."},{"t":"Genesis 2","e":"Dust is the man’s origin in 2:7, but toil and thorns come with the cursed ground in 3:17–19."},{"t":"Genesis 4","e":"Genesis 4 has the ground no longer yielding for Cain (4:12), a related theme, but thorns and ‘dust you are’ are Genesis 3."}],"ref":"Genesis 3:17–19","rem":"Thorns, sweat and ‘dust you are’: Genesis 3."},{"id":"G3-11","ch":3,"theme":"Consequences","type":"Matching","mech":"match","lines":false,"diff":"Medium","time":45,"xp":20,"tag":"The Fall","tt":"Medium","obj":"Match each consequence to who receives it.","instr":"Tap a left card, then its match on the right.","q":"Match each consequence in Genesis 3.","L":["The serpent","The woman","The man","The ground"],"R":["On your belly you shall go","Pain in childbearing increased","By the sweat of your face you will eat bread","Thorns and thistles it shall bring forth"],"ex":["The serpent is cursed: on its belly it will go and eat dust (3:14).","The woman: pain in childbearing increased (3:16).","The man: food by the sweat of his face until he returns to the ground (3:19).","The ground is cursed and will bring forth thorns and thistles (3:17–18)."],"ok":"Each party receives a consequence: serpent, woman, man, and the ground itself.","ref":"Genesis 3:14–19","rem":"Serpent, woman, man, ground: four consequences."},{"id":"G3-12","ch":3,"theme":"Who is cursed?","type":"True/False","mech":"tf","diff":"Hard","time":15,"xp":25,"tag":"The Fall","tt":"High","obj":"Read the consequences closely.","instr":"True or false?","q":"In Genesis 3, God pronounces the word ‘cursed’ directly on the man and on the woman.","ans":false,"ok":"Right, it is false. ‘Cursed’ is said of the serpent (3:14) and of the ground ‘because of you’ (3:17). The man and woman receive consequences (3:16–19), but not the words ‘cursed are you’.","no":"Look closely: ‘cursed’ is said of the serpent (3:14) and the ground (3:17). The man and woman face consequences, but the text does not say ‘cursed are you’ to them.","ref":"Genesis 3:14–19","rem":"Cursed: the serpent and the ground."},{"id":"G3-13","ch":3,"theme":"Judgement to expulsion","type":"Story Reconstruction","mech":"order","diff":"Hard","time":55,"xp":25,"tag":"Biblical Sequence","tt":"Medium","obj":"Rebuild the end of Genesis 3.","instr":"Rebuild the story, first at the top.","q":"Rebuild Genesis 3:14–24 in order.","items":[{"t":"God speaks to the serpent","r":"Genesis 3:14–15"},{"t":"God speaks to the woman","r":"Genesis 3:16"},{"t":"God speaks to the man","r":"Genesis 3:17–19"},{"t":"The man names his wife Eve","r":"Genesis 3:20"},{"t":"God makes garments of skin","r":"Genesis 3:21"},{"t":"They are sent out of the garden","r":"Genesis 3:23"},{"t":"Cherubim guard the way to the tree of life","r":"Genesis 3:24"}],"ok":"Serpent, woman, man; a name, a gift of clothing, a sending out, and a guarded way.","ref":"Genesis 3:14–24","rem":"Serpent, woman, man, Eve, skins, sent out, cherubim."},{"id":"G3-14","ch":3,"theme":"Expulsion from Eden","type":"What Comes Next?","mech":"mc","diff":"Hard","time":25,"xp":25,"tag":"The Fall","tt":"Medium","obj":"Recall how Genesis 3 ends.","instr":"Pick what happens next.","q":"God says the man must not reach out and take also from the tree of life and live forever (3:22). What happens next?","opts":[{"t":"He is sent out of the garden to work the ground","ok":1,"e":"The LORD God sent him out of Eden to work the ground from which he was taken (3:23)."},{"t":"He eats from the tree of life","e":"The text prevents this: he is sent out and the way to the tree is guarded (3:23–24)."},{"t":"The serpent is destroyed","e":"The serpent’s judgement was already spoken (3:14–15). No destruction is described here."},{"t":"God plants a new garden","e":"There is no new garden. Cherubim and a flaming sword guard the way to the tree of life (3:24)."}],"r "},{"t":"The man formed from dust","r":"Genesis 2:7"},{"t":"The woman made from the rib","r":"Genesis 2:22"},{"t":"The serpent speaks","r":"Genesis 3:1"},{"t":"Fig-leaf coverings","r":"Genesis 3:7"},{"t":"Cherubim guard the way to the tree of life","r":"Genesis 3:24"}],"ok":"From light to the guarded tree of life: the whole arc of Genesis 1–3 in the order the text tells it.","ref":"Genesis 1:3–3:24","rem":"Light, image, rest, dust, rib, serpent, fig leaves, cherubim."}];

  var h='<div class="top"><button class="back" id="bk" aria-label="Back">&#8592;</button><h2>'+(k==="M"?"Master challenges":"Genesis "+k+": "+CHAP[k].name)+'</h2><span class="xp">'+totalXP()+' XP</span></div>';
  L.forEach(function(c,i){var r=S.res[c.id],lk=!unlocked(c);
    h+='<button class="row'+(lk?" locked":"")+'" data-id="'+c.id+'"><span class="n'+(r?(r.ok?" ok":" miss"):"")+'">'+(r&&r.ok?"&#10003;":i+1)+'</span><span><b>'+esc(c.theme)+'</b><small>'+esc(c.type)+', '+c.diff.toLowerCase()+'</small></span><span class="r">'+(lk?"Locked":(r?r.best+"/"+c.xp+" XP":c.xp+" XP"))+'</span></button>'});
  app.innerHTML=h;window.scrollTo(0,0);
  $("bk").onclick=home;
  app.querySelectorAll(".row").forEach(function(b){b.onclick=function(){var c=BY[b.dataset.id];if(!unlocked(c)){toast(c.ch==="M"?"Play every challenge in Genesis 1, 2 and 3 to open the masters.":"Play the challenge before this one first.");return}play(c.id)}})}

/* ---------- PLAY ---------- */
var CUR=null;
function play(id){stopTimer();var c=BY[id];if(!c){home();return}CUR={c:c,done:false};
  try{history.replaceState(null,"","#"+id)}catch(e){}
  var qpos=QUEUE?(QUEUE.indexOf(id)+1)+" of "+QUEUE.length+" in revision":"";
  var h='<div class="play"><div class="top"><button class="back" id="bk" aria-label="Back">&#8592;</button><h2>'+(c.ch==="M"?"Master":"Genesis "+c.ch)+'</h2><span class="xp">'+c.xp+' XP</span></div>'+
  '<div class="chips"><span class="chip">'+esc(c.type)+'</span><span class="chip d-'+c.diff+'">'+c.diff+'</span><span class="chip">'+c.time+' seconds</span>'+(qpos?'<span class="chip">'+qpos+'</span>':'')+'</div>'+
  '<div class="timer" id="tm"><i id="tmi"></i></div><div class="card"><p class="instr">'+esc(c.instr)+'</p><h3 class="q">'+esc(c.q)+'</h3><div id="area"></div></div></div>';
  app.innerHTML=h;window.scrollTo(0,0);
  $("bk").onclick=function(){stopTimer();if(c.ch&&!QUEUE)chapter(c.ch);else home()};
  ({mc:mMC,tf:mTF,order:mOrder,match:mMatch,sort:mSort,speed:mSpeed})[c.mech](c,$("area"));
  startTimer(c.time,function(){if(CUR&&!CUR.done&&CUR.timeout)CUR.timeout()});
}
function startTimer(sec,cb){var t0=performance.now(),i=$("tmi"),bar=$("tm");TIMER={raf:0};
  function f(now){if(!TIMER)return;var left=1-(now-t0)/(sec*1000);if(left<=0){i.style.transform="scaleX(0)";stopTimer();cb();return}
    i.style.transform="scaleX("+left+")";bar.classList.toggle("low",left<.25);TIMER.raf=requestAnimationFrame(f)}
  TIMER.raf=requestAnimationFrame(f)}

/* multiple choice (also What Comes Next, Chapter Detective) */
function mMC(c,el){var order=shuffle(c.opts.length);
  el.innerHTML=order.map(function(k){return '<button class="opt" data-k="'+k+'">'+esc(c.opts[k].t)+'</button>'}).join("");
  var bs=el.querySelectorAll(".opt");
  function fin(k){var right=c.opts.findIndex(function(o){return o.ok});bs.forEach(function(b){b.disabled=true;if(+b.dataset.k===right)b.classList.add("right")});
    if(k>=0&&k!==right)el.querySelector('[data-k="'+k+'"]').classList.add("wrong");
    var ok=k===right,body;
    if(ok)body='<p class="fb">'+esc(c.opts[right].e)+'</p>';
    else body=(k>=0?'<div class="fb you"><b>You chose: '+esc(c.opts[k].t)+'</b>'+esc(c.opts[k].e)+'</div>':'')+'<div class="fb ans"><b>Answer: '+esc(c.opts[right].t)+'</b>'+esc(c.opts[right].e)+'</div>';
    finish(ok,ok?1:0,body,k<0)}
  bs.forEach(function(b){b.onclick=function(){fin(+b.dataset.k)}});CUR.timeout=function(){fin(-1)}}
/* true / false */
function mTF(c,el){el.innerHTML='<div class="tf"><button class="opt" data-v="1">True</button><button class="opt" data-v="0">False</button></div>';
  var bs=el.querySelectorAll(".opt");
  function fin(v){var ok=v===(c.ans?1:0);bs.forEach(function(b){b.disabled=true;if(+b.dataset.v===(c.ans?1:0))b.classList.add("right")});
    if(v>=0&&!ok)el.querySelector('[data-v="'+v+'"]').classList.add("wrong");
    var body=ok?'<p class="fb">'+esc(c.ok)+'</p>':'<div class="fb ans"><b>The answer is '+(c.ans?"True":"False")+'</b>'+esc(c.no)+'</div>';
    finish(ok,ok?1:0,body,v<0)}
  bs.forEach(function(b){b.onclick=function(){fin(+b.dataset.v)}});CUR.timeout=function(){fin(-1)}}
/* sequencing / story reconstruction */
function mOrder(c,el){var n=c.items.length,ord=shuffle(n),sel=-1,locked=false;
  function draw(res){el.innerHTML='<ol class="ord">'+ord.map(function(k,p){return '<li data-p="'+p+'" class="'+(res?(k===p?"ok":"no"):(sel===p?"sel":""))+'" tabindex="0"><span class="k">'+(p+1)+'</span><span>'+esc(c.items[k].t)+'</span><button data-u="'+p+'" aria-label="Move up"'+(p===0||res?" disabled":"")+'>&#9650;</button><button data-d="'+p+'" aria-label="Move down"'+(p===n-1||res?" disabled":"")+'>&#9660;</button></li>'}).join("")+'</ol>'+(res?"":'<button class="btn b-ink check" id="chk">Check my order</button>');
    if(res)return;
    el.querySelectorAll("li").forEach(function(li){li.onclick=function(e){if(e.target.closest("button"))return;var p=+li.dataset.p;if(sel<0)sel=p;else if(sel===p)sel=-1;else{var t=ord[sel];ord[sel]=ord[p];ord[p]=t;sel=-1}draw()};li.onkeydown=function(e){if(e.key==="Enter")li.click()}});
    el.querySelectorAll("[data-u]").forEach(function(b){b.onclick=function(){var p=+b.dataset.u,t=ord[p-1];ord[p-1]=ord[p];ord[p]=t;sel=-1;draw()}});
    el.querySelectorAll("[data-d]").forEach(function(b){b.onclick=function(){var p=+b.dataset.d,t=ord[p+1];ord[p+1]=ord[p];ord[p]=t;sel=-1;draw()}});
    $("chk").onclick=function(){check(false)}}
  function check(to){if(locked)return;locked=true;draw(true);var right=ord.filter(function(k,p){return k===p}).length,ok=right===n;
    var body=ok?'<p class="fb">'+esc(c.ok)+'</p>':'<p class="fb"><b>'+right+' of '+n+' in the right place.</b> Here is the order Genesis gives:</p><ol class="lst">'+c.items.map(function(it,k){var p=ord.indexOf(k),good=p===k;return '<li class="'+(good?"ok":"no")+'">'+(k+1)+'. '+esc(it.t)+' <span style="color:#5F6679">('+esc(it.r)+')</span>'+(good?"":'<br><small>You had this at position '+(p+1)+'.</small>')+'</li>'}).join("")+'</ol><p class="fb">'+esc(c.ok)+'</p>';
    finish(ok,right/n,body,to)}
  draw();CUR.timeout=function(){check(true)}}
/* matching (tap) and connect-the-line (draw) */
var COLS=["#24305A","#B4363F","#3F8A5F","#C9962A","#6B4FA0","#2E7FA6"];
function mMatch(c,el){var n=c.L.length,ro=shuffle(n),link={},sel=null,checked=false,drag=null,lines=!!c.lines;
  var h='<div class="match '+(lines?"lines":"tap")+'" id="mm">'+(lines?'<svg id="sv" aria-hidden="true"></svg>':'');
  for(var r=0;r<n;r++){h+='<div class="mi L" tabindex="0" data-l="'+r+'" style="grid-column:1;grid-row:'+(r+1)+'">'+esc(c.L[r])+(lines?'<span class="dot"></span>':'')+'</div><div class="mi R" tabindex="0" data-r="'+ro[r]+'" style="grid-column:2;grid-row:'+(r+1)+'">'+(lines?'<span class="dot"></span>':'')+esc(c.R[ro[r]])+'</div>'}
  el.innerHTML=h+'</div><button class="btn b-ink check" id="chk" disabled>'+(lines?"Check my lines":"Check my matches")+'</button>';
  var box=$("mm"),sv=$("sv"),chk=$("chk");
  function E(side,k){return box.querySelector(side==="L"?'[data-l="'+k+'"]':'[data-r="'+k+'"]')}
  function anc(e,side){var a=box.getBoundingClientRect(),b=e.getBoundingClientRect();return {x:(side==="L"?b.right:b.left)-a.left,y:b.top+b.height/2-a.top}}
  function draw(tmp){var used={};Object.keys(link).forEach(function(l){used[link[l]]=l});
    if(lines){var s="";Object.keys(link).forEach(function(l){var p=anc(E("L",l),"L"),q=anc(E("R",link[l]),"R"),col=checked?(+link[l]===+l?"#3F8A5F":"#B4363F"):COLS[l%COLS.length];
      s+='<path d="M'+p.x+' '+p.y+' C'+(p.x+26)+' '+p.y+' '+(q.x-26)+' '+q.y+' '+q.x+' '+q.y+'" stroke="'+col+'" stroke-width="4" fill="none" stroke-linecap="round"/>'});
      if(tmp)s+='<path d="M'+tmp.x1+' '+tmp.y1+' L'+tmp.x2+' '+tmp.y2+'" stroke="#E3B341" stroke-width="4" stroke-dasharray="6 5" fill="none" stroke-linecap="round"/>';sv.innerHTML=s}
    box.querySelectorAll(".mi").forEach(function(e){var isL=e.dataset.l!==undefined,k=isL?e.dataset.l:e.dataset.r,l=isL?(link[k]!==undefined?k:null):(used[k]!==undefined?used[k]:null);
      var bd=e.querySelector(".bd");if(bd)bd.remove();
      if(!lines&&l!==null){var s=document.createElement("span");s.className="bd";s.style.background=checked?(+link[l]===+l?"#3F8A5F":"#B4363F"):COLS[l%COLS.length];s.textContent=(+l+1);e.appendChild(s)}
      e.classList.toggle("sel",!checked&&isL&&sel!==null&&+k===sel)});
    if(!checked)chk.disabled=Object.keys(link).length<n}
  function connect(l,r){Object.keys(link).forEach(function(k){if(+link[k]===+r)delete link[k]});link[l]=r;sel=null;draw()}
  function tapL(l){if(link[l]!==undefined&&sel===null){delete link[l];draw();return}sel=(sel===l?null:l);draw()}
  function tapR(r){if(sel!==null)connect(sel,r);else{var u=Object.keys(link).filter(function(k){return +link[k]===+r})[0];if(u!==undefined){delete link[u];draw()}else toast("Tap a card on the left first.")}}
  box.addEventListener("pointerdown",function(e){if(checked)return;var t=e.target.closest(".mi");if(!t)return;e.preventDefault();
    drag={l:t.dataset.l!==undefined?+t.dataset.l:undefined,r:t.dataset.r!==undefined?+t.dataset.r:undefined,sx:e.clientX,sy:e.clientY,moved:false};
    if(lines&&drag.l!==undefined){var a=anc(t,"L");drag.x1=a.x;drag.y1=a.y}});
  window.onpointermove=function(e){if(!drag||!lines||drag.l===undefined)return;if(Math.abs(e.clientX-drag.sx)+Math.abs(e.clientY-drag.sy)>8)drag.moved=true;
    if(drag.moved){var a=box.getBoundingClientRect();draw({x1:drag.x1,y1:drag.y1,x2:e.clientX-a.left,y2:e.clientY-a.top})}};
  window.onpointerup=function(e){if(!drag)return;var d=drag;drag=null;
    if(d.moved){var t=document.elementFromPoint(e.clientX,e.clientY);t=t&&t.closest(".mi.R");if(t&&box.contains(t))connect(d.l,+t.dataset.r);else draw();return}
    if(d.l!==undefined)tapL(d.l);else tapR(d.r)};
  box.addEventListener("keydown",function(e){if(checked||e.key!=="Enter")return;var t=e.target.closest(".mi");if(!t)return;if(t.dataset.l!==undefined)tapL(+t.dataset.l);else tapR(+t.dataset.r)});
  window.onresize=function(){draw()};
  function check(to){if(checked)return;checked=true;var got=0;
    for(var l=0;l<n;l++){var ok=link[l]!==undefined&&+link[l]===l;if(ok)got++;E("L",l).classList.add(ok?"ok":"no");if(link[l]!==undefined)E("R",link[l]).classList.add(ok?"ok":"no")}
    draw();chk.disabled=true;
    var body=got===n?'<p class="fb">'+esc(c.ok)+'</p>':'<p class="fb"><b>'+got+' of '+n+' correct.</b></p><ul class="lst">'+c.L.map(function(t,l){var ok=link[l]!==undefined&&+link[l]===l;return '<li class="'+(ok?"ok":"no")+'"><b>'+esc(t)+'</b>: '+esc(c.R[l])+'<br><small>'+esc(c.ex[l])+'</small>'+(ok||link[l]===undefined?"":'<br><small>You linked it to “'+esc(c.R[link[l]])+'”.</small>')+'</li>'}).join("")+'</ul><p class="fb">'+esc(c.ok)+'</p>';
    finish(got===n,got/n,body,to)}
  chk.onclick=function(){check(false)};draw();CUR.timeout=function(){check(true)};
  CUR.cleanup=function(){window.onpointermove=null;window.onpointerup=null;window.onresize=null}}
/* drag & drop into buckets */
function mSort(c,el){var n=c.items.length,pool=shuffle(n),place={},sel=null,checked=false;
  function chip(k,cls){return '<div class="chipc'+(cls||"")+(sel===k?" sel":"")+'" tabindex="0" data-k="'+k+'">'+esc(c.items[k].t)+'</div>'}
  function draw(){var h='<div class="pool" id="pool">'+(pool.length?pool.map(function(k){return chip(k)}).join(""):'<span class="empty">All placed. Check your answer.</span>')+'</div><div class="bks '+(c.buckets.length===2?"c2":"c3")+'">';
    c.buckets.forEach(function(b,bi){h+='<div class="bk" data-b="'+bi+'" tabindex="0"><h4>'+esc(b)+'</h4><div class="in">'+Object.keys(place).filter(function(k){return place[k]===bi}).map(function(k){return chip(+k,checked?(c.items[k].b===bi?" ok":" no"):"")}).join("")+'</div></div>'});
    el.innerHTML=h+'</div>'+(checked?"":'<button class="btn b-ink check" id="chk"'+(pool.length?" disabled":"")+'>Check my answer</button>');
    if(checked)return;
    el.querySelectorAll(".chipc").forEach(function(ch){ch.addEventListener("pointerdown",function(e){dragStart(e,ch)});ch.onkeydown=function(e){if(e.key==="Enter")tapChip(+ch.dataset.k)}});
    el.querySelectorAll(".bk").forEach(function(b){b.onclick=function(e){if(e.target.closest(".chipc"))return;if(sel!==null)put(sel,+b.dataset.b)};b.onkeydown=function(e){if(e.key==="Enter"&&sel!==null&&!e.target.closest(".chipc"))put(sel,+b.dataset.b)}});
    $("chk").onclick=function(){check(false)}}
  function tapChip(k){if(place[k]!==undefined&&sel===null){delete place[k];pool.push(k);draw();return}sel=(sel===k?null:k);draw()}
  function put(k,b){pool=pool.filter(function(x){return x!==k});place[k]=b;sel=null;draw()}
  function back(k){if(place[k]!==undefined){delete place[k];pool.push(k)}sel=null;draw()}
  function dragStart(e,ch){if(checked)return;e.preventDefault();var k=+ch.dataset.k,sx=e.clientX,sy=e.clientY,moved=false,gh=null,over=null;
    function tgt(x,y){var t=document.elementFromPoint(x,y);return t&&(t.closest(".bk")||t.closest(".pool"))}
    function mv(ev){if(!moved&&Math.abs(ev.clientX-sx)+Math.abs(ev.clientY-sy)>8){moved=true;gh=ch.cloneNode(true);gh.classList.add("ghost");gh.style.width=ch.offsetWidth+"px";document.body.appendChild(gh);ch.style.opacity=".35"}
      if(moved){gh.style.left=ev.clientX+"px";gh.style.top=ev.clientY+"px";var t=tgt(ev.clientX,ev.clientY);if(t!==over){if(over)over.classList.remove("over");over=t;if(t&&t.classList.contains("bk"))t.classList.add("over")}
        if(ev.clientY<70)window.scrollBy(0,-12);else if(ev.clientY>window.innerHeight-70)window.scrollBy(0,12)}}
    function up(ev){document.removeEventListener("pointermove",mv);document.removeEventListener("pointerup",up);document.removeEventListener("pointercancel",up);
      if(!moved){tapChip(k);return}if(gh)gh.remove();ch.style.opacity="";if(over)over.classList.remove("over");
      var t=tgt(ev.clientX,ev.clientY);if(!t){draw();return}if(t.classList.contains("pool"))back(k);else put(k,+t.dataset.b)}
    document.addEventListener("pointermove",mv);document.addEventListener("pointerup",up);document.addEventListener("pointercancel",up)}
  function check(to){if(checked)return;checked=true;draw();var got=0;c.items.forEach(function(it,k){if(place[k]===it.b)got++});
    var body=got===n?'<p class="fb">'+esc(c.ok)+'</p>':'<p class="fb"><b>'+got+' of '+n+' in the right place.</b></p><ul class="lst">'+c.items.map(function(it,k){var ok=place[k]===it.b;if(ok)return "";return '<li class="no"><b>'+esc(it.t)+'</b> belongs in '+esc(c.buckets[it.b])+'.'+(place[k]!==undefined?' You put it in '+esc(c.buckets[place[k]])+'.':' Not placed.')+'<br><small>'+esc(it.e)+'</small></li>'}).join("")+'</ul><p class="fb">'+esc(c.ok)+'</p>';
    finish(got===n,got/n,body,to)}
  draw();CUR.timeout=function(){check(true)}}
/* speed round */
function mSpeed(c,el){var i=0,res=[],busy=false,over=false;
  function draw(){if(i>=c.rounds.length){end(false);return}var r=c.rounds[i];
    el.innerHTML='<div class="sp"><p class="cnt">'+(i+1)+' of '+c.rounds.length+'</p><div class="st">'+esc(r.q)+'</div><p class="fl" id="fl"></p><div class="tf"><button class="opt" data-v="1">True</button><button class="opt" data-v="0">False</button></div></div>';
    el.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){if(busy||over)return;busy=true;var v=+b.dataset.v===1,ok=v===r.a;res[i]=ok;
      b.classList.add(ok?"right":"wrong");$("fl").innerHTML='<span style="color:'+(ok?"#3F8A5F":"#B4363F")+'">'+(ok?"Correct. ":"Not quite. ")+'</span>'+esc(r.e);
      setTimeout(function(){busy=false;i++;if(!over)draw()},ok?900:1700)}})}
  function end(to){if(over)return;over=true;var got=res.filter(Boolean).length,n=c.rounds.length;
    var body='<p class="fb"><b>'+got+' of '+n+' correct'+(to?" before the clock ran out":"")+'.</b></p><ul class="lst">'+c.rounds.map(function(r,k){var st=res[k]===undefined?"no":(res[k]?"ok":"no");return '<li class="'+st+'">'+(res[k]===undefined?"Not answered: ":"")+esc(r.q)+'<br><small>'+esc(r.e)+'</small></li>'}).join("")+'</ul>';
    finish(got===n,got/n,body,to)}
  draw();CUR.timeout=function(){end(true)}}

/* ---------- FEEDBACK ---------- */
function finish(ok,frac,body,timeout){if(!CUR||CUR.done)return;CUR.done=true;stopTimer();if(CUR.cleanup)CUR.cleanup();var c=CUR.c;
  var earned=ok?c.xp:Math.round(c.xp*frac/2);var prev=S.res[c.id];
  S.res[c.id]={best:Math.max(earned,prev?prev.best:0),ok:ok||(prev&&prev.ok)||false,tries:(prev?prev.tries:0)+1};
  if(ok)S.miss=S.miss.filter(function(x){return x!==c.id});else if(S.miss.indexOf(c.id)<0)S.miss.push(c.id);save();
  var head=timeout&&!ok?["Time’s up","#5F6679","&#8987;"]:ok?["Correct","#3F8A5F","&#10003;"]:frac>0?["Nearly there","#C9962A","&#9675;"]:["Not quite","#B4363F","&#10005;"];
  var nextLbl=QUEUE?(QUEUE.indexOf(c.id)<QUEUE.length-1?"Next revision":"Finish revision"):(nextInChapter(c)?"Next challenge":"Back to chapters");
  $("sheetIn").innerHTML='<div class="vd"><span class="ic" style="background:'+head[1]+'">'+head[2]+'</span><h3 id="vdT">'+head[0]+'</h3><span class="gx">+'+earned+' XP</span></div>'+body+
   '<span class="ref">'+esc(c.ref)+'</span><div class="rem"><b>Remember this</b><p>'+esc(c.rem)+'</p></div>'+
   '<div class="acts"><button class="btn b-gold wide" id="nx">'+nextLbl+'</button><button class="btn b-page" id="ag">Try again</button><button class="btn b-page" id="sh">Share challenge</button></div>';
  setTimeout(function(){$("sheet").hidden=false;$("nx").focus()},ok?350:600);
  $("nx").onclick=function(){$("sheet").hidden=true;goNext(c)};
  $("ag").onclick=function(){$("sheet").hidden=true;play(c.id)};
  $("sh").onclick=function(){share("Genesis Quest challenge "+c.id+": "+c.q+" Can you get it right?",baseURL()+"#"+c.id)}}
function nextInChapter(c){var L=list(c.ch),i=L.indexOf(c);return L[i+1]||null}
function goNext(c){if(QUEUE){var i=QUEUE.indexOf(c.id);var rest=QUEUE.slice(i+1);if(rest.length){play(rest[0]);return}toast("Revision finished. Well done.");home();return}
  var n=nextInChapter(c);if(n)play(n.id);else{toast(c.ch==="M"?"You have finished Genesis Quest.":"Genesis "+c.ch+" complete.");home()}}

/* ---------- SHARE ---------- */
function baseURL(){return location.href.split("#")[0]}
function share(text,url){if(navigator.share){navigator.share({title:"Genesis Quest",text:text,url:url}).catch(function(){});return}
  var full=text+" "+url;(navigator.clipboard?navigator.clipboard.writeText(full):Promise.reject()).then(function(){toast("Link copied. Paste it anywhere to share.")}).catch(function(){try{window.prompt("Copy this link to share:",url)}catch(e){toast(url)}})}

/* ---------- START ---------- */
var h=location.hash.slice(1);if(h&&BY[h])play(h);else home();
</script>
